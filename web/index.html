<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf7ff"><meta name="description" content="Telegram 频道历史内容检索"><title>频道历史内容 · Telegram Search</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><div class="logo">➤</div><div><b>频道历史内容</b><span>Telegram Search</span></div></div><nav><a href="#results">检索</a><a href="https://api-tg-history-search.xph.asia/submit">添加频道</a></nav></header><main><section class="hero"><div class="hero-copy"><h1>让每一条优质内容<br><strong>都能再次被发现</strong></h1><p>检索已采集的 Telegram 频道历史内容，快速定位文字、图片、视频、文件与音频资源。</p><div id="search" class="search"><span class="search-icon">⌕</span><input id="q" autocomplete="off" placeholder="搜索：AI 工具、Midjourney、教程…"><button id="searchBtn">搜索</button></div><div class="filters"><div class="channel-wrap"><span class="field-icon">➤</span><input id="channel" list="channelList" placeholder="频道 @username（可选）"><datalist id="channelList"></datalist></div><label class="date-field"><span>开始日期</span><input id="from" type="date" aria-label="开始日期"></label><span class="date-separator">至</span><label class="date-field"><span>结束日期</span><input id="to" type="date" aria-label="结束日期"></label></div></div></section><section class="home-summary" aria-label="系统收录概况"><div class="message-stat"><span class="stat-label">已收录消息</span><strong id="statMessages">加载中…</strong><span>来自 <b id="statChannels">—</b> 个 Telegram 频道</span></div></section><section class="quick-actions" aria-label="常用功能"><a href="#search" class="quick-action">🔍 <span><b>搜索内容</b><small>查找历史消息</small></span></a><a href="#results" class="quick-action" id="browseChannels">📚 <span><b>浏览频道</b><small>查看搜索结果中的频道</small></span></a><a href="#results" class="quick-action" id="latestQuick">🆕 <span><b>最新消息</b><small>查看最近采集内容</small></span></a></section><p class="support-note">支持文字、图片、视频、文件和音频内容搜索</p><section id="results"><div class="section-title"><div><h2>搜索结果</h2><span id="hint">输入关键词开始检索</span></div><button class="latest" id="latestBtn">查看最新</button></div><div id="list" class="list"></div><div id="more" class="more"></div></section></main><script src="app.js"></script></body></html>
