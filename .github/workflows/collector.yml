name: Telegram Collector
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: "只同步指定频道（可选）"
        required: false
        type: string
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r collector/requirements.txt
      - name: Run incremental collector
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          BATCH_SIZE: 250
          TARGET_CHANNEL: ${{ inputs.target_channel }}
        run: python collector/collector.py
