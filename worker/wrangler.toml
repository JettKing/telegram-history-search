name = "tg-history-search"
main = "src/index.js"
compatibility_date = "2026-09-05"

[assets]
directory = "../web"
binding = "ASSETS"

[cache]
enabled = true

[vars]
# Set secrets in Cloudflare, not in this file:
# BOT_TOKEN, ADMIN_TOKEN, WORKER_INGEST_TOKEN, GH_DISPATCH_TOKEN, GH_TARGET_REPOSITORY, GH_TARGET_REF
# Optional comma-separated cross-origin frontend origins; same-origin requests are automatic.
# CORS_ORIGINS = "https://admin.example.com"

[[d1_databases]]
binding = "DB"
database_name = "tg-history-search"
database_id = "2cd55131-fbc3-48bf-b9bc-121ae1333e79"
